name: Ommaviy ma'lumotlarni statik faylga sinxronlash

# Bosh sahifadagi hamkorlar, statistika va ijtimoiy tarmoq havolalari
# odatda Render backend'dan jonli so'raladi — backend "uxlab" yotgan payt
# birinchi tashrif buyuruvchi 30-60+ soniya kutishga majbur bo'ladi.
#
# Bu ish har 10 daqiqada backend'dan bu ma'lumotlarni oldindan olib,
# docs/data/*.json fayllariga yozib, repo'ga commit qiladi. GitHub Pages
# bu fayllarni CDN orqali DOIM tez beradi — sayt birinchi navbatda shu
# statik fayllardan o'qiydi (main.js/social-footer.js), faqat ular
# topilmasa yoki bo'sh bo'lsa jonli API'ga murojaat qiladi (zaxira yo'l).
#
# Diqqat: bu ma'lumotlar bir necha daqiqagacha eskirgan bo'lishi mumkin
# (admin panelda yangi hamkor qo'shilgach, keyingi sinxronizatsiyagacha) —
# bu qabul qilingan almashinuv, chunki sahifa yuklanishi hech qachon
# Render'ning uyg'onishini kutib turmaydi.
on:
  schedule:
    - cron: '*/10 * * * *' # har 10 daqiqada
  workflow_dispatch: {} # Actions bo'limidan qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ma'lumotlarni backend'dan olish
        run: |
          set -e
          mkdir -p docs/data
          BASE="https://exon-backend-zgtl.onrender.com"
          curl -sS --max-time 90 --fail "$BASE/api/partners" -o docs/data/partners.json
          curl -sS --max-time 30 --fail "$BASE/api/stats" -o docs/data/stats.json
          curl -sS --max-time 30 --fail "$BASE/api/social" -o docs/data/social.json
          # Har bir fayl haqiqatan ham to'g'ri JSON ekanini tekshiramiz —
          # aks holda buzilgan javob repo'ga yozilib qolmasin
          for f in partners stats social; do
            node -e "JSON.parse(require('fs').readFileSync('docs/data/$f.json','utf8'))"
          done

      - name: O'zgarish bo'lsa commit va push qilish
        run: |
          git config user.name "EXON Data Sync Bot"
          git config user.email "actions@github.com"
          git add docs/data/partners.json docs/data/stats.json docs/data/social.json
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q — commit qilinmadi"
          else
            git commit -m "Ommaviy ma'lumotlar statik faylga sinxronlandi [skip ci]"
            git push
          fi
