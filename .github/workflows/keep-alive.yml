name: Backendni uxlab qolishdan saqlash

# Render bepul tarifi ~15 daqiqa so'rov kelmasa serverni "uxlatib" qo'yadi,
# shundan keyingi birinchi so'rov 30-50+ soniya kutishga majbur qiladi.
# Bu ish har 10 daqiqada backendning sog'ligini tekshiruvchi (/api/health)
# manzilga bir marta "chertib" turadi — shu bilan server hech qachon
# uxlab qolmaydi, foydalanuvchilar kutish muddatini sezmaydi.
#
# Diqqat: Render'ning bepul tarifida oyiga umumiy ishlash vaqti chegarasi
# bor (odatda ~750 soat/oy). Shuning uchun tunda soat 01:00 dan 04:00 gacha
# (Toshkent vaqti) — bu vaqtda odatda hech kim ishlamaydi — ataylab
# "chertilmaydi", shu 3 soat davomida server tabiiy ravishda uxlab, oyiga
# ~90 soatgacha zaxira qo'shadi. UTC'da bu 20:00-22:59 oralig'iga to'g'ri
# keladi (Toshkent = UTC+5).
on:
  schedule:
    - cron: '*/10 0-19,23 * * *' # har 10 daqiqada, lekin 01:00-04:00 (Toshkent) oralig'idan tashqari
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: /api/health manziliga so'rov
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://exon-backend-zgtl.onrender.com/api/health)
          echo "Javob kodi: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend kutilmagan javob qaytardi (status $STATUS) — Render dashboard'ni tekshiring"
          fi
