/* ════════════════════════════════════════════════════════════════════════════
   BLOG — maqolalar sahifasi
   ════════════════════════════════════════════════════════════════════════════ */

.blog {
  min-height: 100svh;
  padding: calc(var(--nav-h) + clamp(26px,4.6vh,62px)) 0 clamp(40px,8vh,80px);
  position: relative;
  overflow: hidden;
}

.blog::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: radial-gradient(ellipse 75% 55% at calc(50% - 12px) calc(30%), rgba(11,209,108,.05), transparent 70%);
  filter: blur(24px);
}

.blog__head {
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto clamp(48px,7vh,72px);
  padding: 0 clamp(18px,3.4vw,40px);
  text-align: center;
}

.blog__kicker {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
}

.blog__title {
  font-size: clamp(2rem,5vw,3.2rem);
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 16px;
}

.blog__desc {
  font-size: 16px;
  color: var(--gray);
  max-width: 560px;
  margin: 0 auto;
}

/* ── GRID ── */
.blog__grid {
  width: 100%;
  max-width: var(--wrap);
  margin: clamp(48px,7vh,72px) auto 0;
  padding: 0 clamp(18px,3.4vw,40px);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: clamp(20px, 3.2vw, 32px);
}

/* ── ARTICLE CARD ── */
.article-card {
  display: flex;
  flex-direction: column;
  padding: clamp(24px,4vw,32px);
  border: 1px solid var(--line-2);
  border-radius: 12px;
  background: rgba(var(--surface-rgb), .5);
  backdrop-filter: blur(8px);
  transition: all .3s cubic-bezier(.22,.68,.28,1);
  cursor: pointer;
  overflow: hidden;
}

.article-card__img {
  width: calc(100% + clamp(48px,8vw,64px));
  margin: calc(-1 * clamp(24px,4vw,32px)) calc(-1 * clamp(24px,4vw,32px)) 20px;
  height: 150px;
  object-fit: cover;
  display: block;
}

.article-card:hover {
  border-color: rgba(11, 209, 108, .4);
  background: rgba(var(--surface-rgb), .8);
  transform: translateY(-4px);
}

.article-card__tag {
  display: inline-flex;
  width: fit-content;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--green);
  padding: 6px 10px;
  background: rgba(11, 209, 108, .1);
  border-radius: 4px;
  margin-bottom: 16px;
}

.article-card__title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
  line-height: 1.3;
  color: var(--white);
}

.article-card__desc {
  font-size: 14px;
  color: var(--gray);
  margin-bottom: 16px;
  flex-grow: 1;
  line-height: 1.55;
}

.article-card__meta {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--gray-dim);
}

.article-card__date {
  display: flex;
  align-items: center;
  gap: 4px;
}

.article-card__read {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  color: var(--green);
  font-weight: 500;
}

/* ── SEARCH/FILTER ── */
.blog-filter {
  width: 100%;
  max-width: var(--wrap);
  margin: clamp(24px,4vh,40px) auto 0;
  padding: 0 clamp(18px,3.4vw,40px);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  background: var(--surface);
  color: var(--gray);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s cubic-bezier(.22,.68,.28,1);
}

.filter-btn:hover,
.filter-btn.is-active {
  background: linear-gradient(140deg, var(--green-hi) 0%, var(--green) 52%, #1FA36C 100%);
  color: var(--green-ink);
  border-color: var(--green);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .blog__grid {
    grid-template-columns: 1fr;
  }

  .blog__title {
    font-size: 1.8rem;
  }
}

<script>
// Nav scroll blur
(function() {
  const nav = document.getElementById('nav');
  function onScroll() {
    nav.classList.toggle('is-scrolled', window.scrollY > 12);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Burger menu
  const burger = document.getElementById('burger');
  const menu = document.getElementById('navMenu');

  function setMenu(open) {
    menu.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
  }

  burger.addEventListener('click', () => {
    setMenu(burger.getAttribute('aria-expanded') !== 'true');
  });

  menu.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') setMenu(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') {
      setMenu(false);
    }
  });
})();

// Maqolalarni admin panel bazasidan yuklash
(function () {
  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  function renderPost(p) {
    return '<article class="article-card">' +
      (p.image ? '<img class="article-card__img" src="' + p.image + '" alt="" />' : '') +
      '<span class="article-card__tag">' + esc(p.tag) + '</span>' +
      '<h2 class="article-card__title">' + esc(p.title) + '</h2>' +
      '<p class="article-card__desc">' + esc(p.desc) + '</p>' +
      '<div class="article-card__meta">' +
      '<div class="article-card__date">📅 ' + esc(p.date) + '</div>' +
      '<div class="article-card__read">' + esc(p.readTime) + '</div>' +
      '</div></article>';
  }

  fetch(window.EXON_API_BASE + '/api/posts')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      const list = document.getElementById('blog-list');
      if (!data.success || !data.posts.length) {
        list.innerHTML = '<p style="color:var(--gray-dim);grid-column:1/-1;text-align:center">Hozircha maqolalar yo\'q.</p>';
        return;
      }
      list.innerHTML = data.posts.map(renderPost).join('');
      document.querySelectorAll('.article-card').forEach(function (card) {
        card.addEventListener('click', function () { alert('Maqola sahifasi tayyorlanmoqda... 📖'); });
      });
    })
    .catch(function () {
      document.getElementById('blog-list').innerHTML =
        '<p style="color:var(--gray-dim);grid-column:1/-1;text-align:center">Maqolalarni yuklab bo\'lmadi. Birozdan so\'ng qayta urinib ko\'ring.</p>';
    });
})();
</script>
