.article-loading,.article-error{

.article-error h1{color:var(--white);font-size:clamp(2rem,5vw,3.3rem);margin-bottom:14px}
.article-back{

.article-back:hover{color:var(--green);border-color:var(--green)}
.article-shell{
  width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(18px,3.4vw,40px);
  display:flex;flex-direction:column;
}
.article-cover{
  width:min(100%,820px);margin:0 auto;aspect-ratio:16/9;position:relative;overflow:hidden;
  border:1px solid var(--line-2);border-radius:26px;background:var(--surface);
  box-shadow:0 32px 80px -48px rgba(var(--green-rgb),.55);
}
.article-cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.article-cover__fallback{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:36px;text-align:center;
  background:
    radial-gradient(circle at 70% 20%,rgba(80,245,177,.24),transparent 32%),
    radial-gradient(circle at 25% 75%,rgba(11,209,108,.18),transparent 38%),
    linear-gradient(155deg,#17231e,#0c0f0e);
}
.article-cover__fallback img{width:min(76%,250px);height:auto;object-fit:contain}
.article-cover__fallback span{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.article-content{width:min(100%,820px);margin:clamp(36px,6vh,64px) auto 0}
.article-content__tag{
  display:inline-flex;padding:7px 11px;border-radius:5px;background:rgba(11,209,108,.12);
  color:var(--green);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.article-content h1{
  margin:18px 0 16px;font-size:clamp(2.1rem,5.2vw,4.2rem);font-weight:700;line-height:1.03;letter-spacing:-.035em;
}
.article-meta{display:flex;flex-wrap:wrap;gap:12px 22px;padding-bottom:24px;border-bottom:1px solid var(--line);color:var(--gray-dim);font-size:13px}
.article-copy{padding-top:clamp(26px,4vh,42px);color:var(--gray);font-size:clamp(16px,1.55vw,18px);line-height:1.85;font-weight:300}
.article-copy p{white-space:pre-line;margin-bottom:1.35em}
.article-copy p:last-child{margin-bottom:0}
.article-content>.article-back{margin-top:clamp(32px,5vh,52px)}
@media(max-width:820px){

  .article-content h1{font-size:clamp(2rem,9vw,3.35rem)}

@media(max-width:460px){

<script>
(function () {
  var nav = document.getElementById('nav');
  var burger = document.getElementById('burger');
  var menu = document.getElementById('navMenu');
  function onScroll() { nav.classList.toggle('is-scrolled', window.scrollY > 12); }
  function setMenu(open) { menu.classList.toggle('is-open', open); burger.setAttribute('aria-expanded', String(open)); }
  window.addEventListener('scroll', onScroll, { passive:true });
  burger.addEventListener('click', function () { setMenu(burger.getAttribute('aria-expanded') !== 'true'); });
  menu.addEventListener('click', function (event) { if (event.target.tagName === 'A') setMenu(false); });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') setMenu(false); });
  onScroll();
})();

(function () {
  var root = document.getElementById('article-root');
  var postId = new URLSearchParams(window.location.search).get('id');

  function esc(value) {
    var node = document.createElement('div');
    node.textContent = value == null ? '' : String(value);
    return node.innerHTML;
  }

  function showError() {
    root.innerHTML = '<div class="article-error"><h1>Maqola topilmadi</h1><p>So\'ralgan maqola mavjud emas yoki o\'chirilgan.</p><a class="article-back" href="blog.html">← Blogga qaytish</a></div>';
  }

  function render(post) {
    document.title = post.title + ' — EXON';
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', String(post.desc || '').slice(0, 155));

    var paragraphs = String(post.desc || '').split(/\n\s*\n/).filter(Boolean).map(function (part) {
      return '<p>' + esc(part) + '</p>';
    }).join('');
    var cover = post.image
      ? '<img src="' + esc(post.image) + '" alt="' + esc(post.title) + '" />'
      : '<div class="article-cover__fallback"><img src="assets/img/logo-exon-light.png" alt="EXON" /><span>' + esc(post.tag || 'Maqola') + '</span></div>';

    root.innerHTML = '<article class="article-shell">' +
      '<div class="article-cover">' + cover + '</div>' +
      '<div class="article-content">' +
        '<span class="article-content__tag">' + esc(post.tag) + '</span>' +
        '<h1>' + esc(post.title) + '</h1>' +
        '<div class="article-meta">' +
          (post.date ? '<span>📅 ' + esc(post.date) + '</span>' : '') +
          (post.readTime ? '<span>◷ ' + esc(post.readTime) + '</span>' : '') +
        '</div>' +
        '<div class="article-copy">' + paragraphs + '</div>' +
        '<a class="article-back" href="blog.html">← Blogga qaytish</a>' +
      '</div>' +
    '</article>';
  }

  if (!postId) { showError(); return; }
  fetch(window.EXON_API_BASE + '/api/posts', { cache:'no-store' })
    .then(function (response) { if (!response.ok) throw new Error('request'); return response.json(); })
    .then(function (data) {
      var posts = data && data.success && Array.isArray(data.posts) ? data.posts : [];
      var post = posts.find(function (item) { return String(item.id) === String(postId); });
      if (!post) { showError(); return; }
      render(post);
    })
    .catch(showError);
})();
</script>
