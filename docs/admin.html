<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — EXON</title>
<link rel="stylesheet" href="assets/css/style.css?v=10" />
<style>
body{background:var(--bg)}
.admin{min-height:100vh}

/* ── LOGIN ── */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-box{
  width:100%;max-width:360px;padding:36px 32px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line-2);
}
.login-box h1{font-size:20px;font-weight:600;margin-bottom:6px}
.login-box p{font-size:13.5px;color:var(--gray);margin-bottom:24px}
.login-box input{
  width:100%;height:46px;padding:0 14px;border-radius:8px;
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--white);
  font-size:15px;margin-bottom:14px;
}
.login-box input:focus{outline:none;border-color:var(--green-deep)}
.login-box button{
  width:100%;height:46px;border-radius:8px;border:0;cursor:pointer;
  background:linear-gradient(140deg,var(--green-hi) 0%,var(--green) 52%,#1FA36C 100%);
  color:var(--green-ink);font-weight:600;font-size:15px;
}
.login-error{color:#F2896F;font-size:13px;margin-top:10px;min-height:16px}

/* ── SHELL ── */
.admin-app{display:none}
.admin-app.is-active{display:block}
.admin-top{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(18px,3vw,32px);border-bottom:1px solid var(--line);
  background:rgba(12,15,14,.9);backdrop-filter:blur(12px);
}
.admin-top__brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.admin-top__brand span{color:var(--green)}
.admin-logout{
  background:var(--surface);border:1px solid var(--line-2);color:var(--gray);
  padding:8px 16px;border-radius:8px;font-size:13.5px;cursor:pointer;
}
.admin-logout:hover{color:var(--white);border-color:var(--line)}

.admin-tabs{
  display:flex;gap:6px;padding:14px clamp(18px,3vw,32px) 0;
  max-width:1200px;margin:0 auto;flex-wrap:wrap;
}
.admin-tab{
  padding:10px 18px;border-radius:8px 8px 0 0;border:1px solid transparent;
  background:none;color:var(--gray);font-size:14px;font-weight:500;cursor:pointer;
}
.admin-tab.is-active{background:var(--surface);color:var(--white);border-color:var(--line);border-bottom-color:var(--surface)}
.admin-tab:hover:not(.is-active){color:var(--white)}

.admin-panel{
  max-width:1200px;margin:0 auto;padding:24px clamp(18px,3vw,32px) 60px;
  display:none;
}
.admin-panel.is-active{display:block}

.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:19px;font-weight:600}
.btn-add{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(140deg,var(--green-hi) 0%,var(--green) 52%,#1FA36C 100%);
  color:var(--green-ink);border:0;padding:10px 18px;border-radius:8px;
  font-weight:600;font-size:14px;cursor:pointer;
}

/* ── STAT CARDS (dashboard) ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{padding:20px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat-card__value{font-size:28px;font-weight:700;color:var(--green-hi);margin-bottom:4px}
.stat-card__label{font-size:12.5px;color:var(--gray-dim);text-transform:uppercase;letter-spacing:.05em}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px}
.admin-table th{text-align:left;padding:10px 12px;color:var(--gray-dim);font-weight:500;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--gray)}
.seg-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.seg-pill.seg-A{background:rgba(76,247,156,.15);color:var(--green-hi)}
.seg-pill.seg-B{background:rgba(11,209,108,.12);color:var(--green)}
.seg-pill.seg-C{background:rgba(152,162,157,.12);color:var(--gray)}

/* ── ITEM LISTS ── */
.item-list{display:flex;flex-direction:column;gap:10px}
.item-row{
  display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
}
.item-row__thumb{
  width:52px;height:52px;border-radius:8px;flex-shrink:0;object-fit:cover;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px;
}
.item-row__body{flex:1;min-width:0}
.item-row__title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row__meta{font-size:12.5px;color:var(--gray-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row__actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{
  width:34px;height:34px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg-2);
  color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--white);border-color:var(--line)}
.icon-btn.danger:hover{color:#F2896F;border-color:#F2896F}
.empty-state{padding:40px;text-align:center;color:var(--gray-dim);font-size:14px}

/* ── MODAL FORM ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
}
.modal-overlay.is-active{display:flex}
.modal-box{
  width:100%;max-width:520px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:16px;padding:28px;margin-bottom:40px;
}
.modal-box h3{font-size:17px;font-weight:600;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--gray);margin-bottom:6px;font-weight:500}
.field input[type=text],.field textarea,.field select{
  width:100%;padding:10px 12px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line-2);color:var(--white);font-size:14px;font-family:inherit;
}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray);font-weight:400}
.img-preview{
  width:100%;height:100px;border-radius:8px;background:var(--surface);border:1px dashed var(--line-2);
  display:flex;align-items:center;justify-content:center;color:var(--gray-dim);font-size:12.5px;
  margin-bottom:8px;overflow:hidden;
}
.img-preview img{width:100%;height:100%;object-fit:cover}
.features-list{display:flex;flex-direction:column;gap:8px}
.feature-row{display:flex;gap:8px}
.feature-row input{flex:1}
.feature-row button{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;color:var(--gray);width:34px;cursor:pointer}
.add-feature{margin-top:4px;background:none;border:1px dashed var(--line-2);border-radius:6px;color:var(--gray);padding:8px;font-size:12.5px;cursor:pointer;width:100%}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;height:44px;border-radius:8px;border:0;font-weight:600;font-size:14px;cursor:pointer}
.modal-save{background:linear-gradient(140deg,var(--green-hi) 0%,var(--green) 52%,#1FA36C 100%);color:var(--green-ink)}
.modal-cancel{background:var(--surface);border:1px solid var(--line-2) !important;color:var(--gray)}
.form-msg{font-size:13px;margin-top:10px;min-height:16px}
.form-msg.error{color:#F2896F}
.form-msg.ok{color:var(--green)}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>EXON Admin</h1>
    <p>Keyslar, blog va narxlarni boshqarish paneli.</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="Parol" autocomplete="current-password" required />
      <button type="submit">Kirish</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ══════════ ADMIN APP ══════════ -->
<div class="admin-app" id="adminApp">
  <div class="admin-top">
    <div class="admin-top__brand">EX<span>ON</span> Admin</div>
    <button class="admin-logout" id="logoutBtn">Chiqish</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab is-active" data-tab="dashboard">Hisobot</button>
    <button class="admin-tab" data-tab="cases">Keyslar</button>
    <button class="admin-tab" data-tab="posts">Blog</button>
    <button class="admin-tab" data-tab="pricing">Narxlar</button>
  </div>

  <!-- DASHBOARD -->
  <section class="admin-panel is-active" id="panel-dashboard">
    <div class="panel-head"><h2>Audit hisobotlari</h2></div>
    <div class="stat-grid" id="statGrid"></div>
    <table class="admin-table">
      <thead><tr><th>Email</th><th>Ball</th><th>Segment</th><th>Sana</th></tr></thead>
      <tbody id="leadsBody"></tbody>
    </table>
  </section>

  <!-- KEYSLAR -->
  <section class="admin-panel" id="panel-cases">
    <div class="panel-head">
      <h2>Keyslar</h2>
      <button class="btn-add" onclick="openCaseForm()">+ Yangi keys</button>
    </div>
    <div class="item-list" id="casesList"></div>
  </section>

  <!-- BLOG -->
  <section class="admin-panel" id="panel-posts">
    <div class="panel-head">
      <h2>Blog maqolalari</h2>
      <button class="btn-add" onclick="openPostForm()">+ Yangi maqola</button>
    </div>
    <div class="item-list" id="postsList"></div>
  </section>

  <!-- NARXLAR -->
  <section class="admin-panel" id="panel-pricing">
    <div class="panel-head">
      <h2>Narxlar paketlari</h2>
      <button class="btn-add" onclick="openPricingForm()">+ Yangi paket</button>
    </div>
    <div class="item-list" id="pricingList"></div>
  </section>
</div>

<!-- ══════════ MODAL: KEYS FORM ══════════ -->
<div class="modal-overlay" id="caseModal">
  <div class="modal-box">
    <h3 id="caseModalTitle">Yangi keys</h3>
    <form id="caseForm">
      <input type="hidden" id="caseId" />
      <div class="field"><label>Teg (masalan: 📱 Elektronika)</label><input type="text" id="caseTag" required /></div>
      <div class="field"><label>Sarlavha</label><input type="text" id="caseTitle" required /></div>
      <div class="field"><label>Tavsif</label><textarea id="caseDesc" required></textarea></div>
      <div class="field-row">
        <div class="field"><label>Statistika 1 — qiymat</label><input type="text" id="caseM1v" placeholder="+340%" /></div>
        <div class="field"><label>Statistika 1 — nomi</label><input type="text" id="caseM1l" placeholder="Trafik" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Statistika 2 — qiymat</label><input type="text" id="caseM2v" placeholder="+218%" /></div>
        <div class="field"><label>Statistika 2 — nomi</label><input type="text" id="caseM2l" placeholder="Buyurtma" /></div>
      </div>
      <div class="field">
        <label>Marketpleyslar</label>
        <div class="checks">
          <label><input type="checkbox" value="uzum" class="caseMarket" /> Uzum</label>
          <label><input type="checkbox" value="wb" class="caseMarket" /> Wildberries</label>
          <label><input type="checkbox" value="yandex" class="caseMarket" /> Yandex Market</label>
        </div>
      </div>
      <div class="field">
        <label>Rasm</label>
        <div class="img-preview" id="caseImgPreview">Rasm tanlanmagan</div>
        <input type="file" id="caseImgFile" accept="image/*" />
      </div>
      <div class="form-msg" id="caseFormMsg"></div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal('caseModal')">Bekor qilish</button>
        <button type="submit" class="modal-save">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ MODAL: POST FORM ══════════ -->
<div class="modal-overlay" id="postModal">
  <div class="modal-box">
    <h3 id="postModalTitle">Yangi maqola</h3>
    <form id="postForm">
      <input type="hidden" id="postId" />
      <div class="field"><label>Teg (masalan: SEO)</label><input type="text" id="postTag" required /></div>
      <div class="field"><label>Sarlavha</label><input type="text" id="postTitle" required /></div>
      <div class="field"><label>Tavsif</label><textarea id="postDesc" required></textarea></div>
      <div class="field-row">
        <div class="field"><label>Sana (masalan: 25 iyul)</label><input type="text" id="postDate" /></div>
        <div class="field"><label>O'qish vaqti (masalan: 5 min)</label><input type="text" id="postRead" /></div>
      </div>
      <div class="field">
        <label>Rasm</label>
        <div class="img-preview" id="postImgPreview">Rasm tanlanmagan</div>
        <input type="file" id="postImgFile" accept="image/*" />
      </div>
      <div class="form-msg" id="postFormMsg"></div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal('postModal')">Bekor qilish</button>
        <button type="submit" class="modal-save">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<!-- ══════════ MODAL: PRICING FORM ══════════ -->
<div class="modal-overlay" id="pricingModal">
  <div class="modal-box">
    <h3 id="pricingModalTitle">Yangi paket</h3>
    <form id="pricingForm">
      <input type="hidden" id="priceId" />
      <div class="field"><label>Belgi (masalan: YANGI BOSHLOVCHILAR)</label><input type="text" id="priceBadge" /></div>
      <div class="field"><label>Nomi</label><input type="text" id="priceName" required /></div>
      <div class="field"><label>Tavsif</label><textarea id="priceDesc"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Narx (masalan: 2,500 yoki Bepul)</label><input type="text" id="priceAmount" required /></div>
        <div class="field"><label>Valyuta/davr (masalan: $/oy)</label><input type="text" id="priceCurrency" /></div>
      </div>
      <div class="field"><label>Davr izohi (masalan: Har 5 ta SKU uchun)</label><input type="text" id="pricePeriod" /></div>
      <div class="field">
        <label>Xususiyatlar ro'yxati</label>
        <div class="features-list" id="featuresList"></div>
        <button type="button" class="add-feature" onclick="addFeatureRow()">+ Qator qo'shish</button>
      </div>
      <div class="field-row">
        <div class="field"><label>Tugma matni</label><input type="text" id="priceCtaLabel" value="Batafsil" /></div>
        <div class="field">
          <label>Tugma turi</label>
          <select id="priceCtaType"><option value="primary">Asosiy (yashil)</option><option value="secondary">Ikkinchi darajali</option></select>
        </div>
      </div>
      <div class="field"><label><input type="checkbox" id="priceFeatured" style="width:auto;margin-right:8px" /> Eng mashhur sifatida belgilash</label></div>
      <div class="form-msg" id="pricingFormMsg"></div>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" onclick="closeModal('pricingModal')">Bekor qilish</button>
        <button type="submit" class="modal-save">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/api-base.js"></script>
<script>
(function () {
  'use strict';
  const API = window.EXON_API_BASE;
  let TOKEN = localStorage.getItem('exon_admin_token') || '';

  const authHeaders = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN });

  async function apiFetch(path, opts) {
    opts = opts || {};
    opts.headers = authHeaders();
    const res = await fetch(API + path, opts);
    if (res.status === 401) { logout(); throw new Error('Sessiya tugagan, qayta kiring'); }
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'Xatolik');
    return data;
  }

  // ── AUTH ──
  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminApp').classList.add('is-active');
    loadDashboard(); loadCases(); loadPosts(); loadPricing();
  }
  function showLogin() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminApp').classList.remove('is-active');
  }
  function logout() {
    TOKEN = ''; localStorage.removeItem('exon_admin_token'); showLogin();
  }
  document.getElementById('logoutBtn').addEventListener('click', function () {
    apiFetch('/api/admin/logout', { method: 'POST' }).catch(function(){}).then(logout);
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const pass = document.getElementById('passwordInput').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const res = await fetch(API + '/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (!data.success) { errEl.textContent = data.error || "Parol noto'g'ri"; return; }
      TOKEN = data.token;
      localStorage.setItem('exon_admin_token', TOKEN);
      showApp();
    } catch (err) {
      errEl.textContent = 'Serverga ulanib bo\'lmadi: ' + err.message;
    }
  });

  if (TOKEN) {
    fetch(API + '/api/admin/me', { headers: authHeaders() })
      .then(function (r) { return r.json(); })
      .then(function (d) { d.success ? showApp() : showLogin(); })
      .catch(showLogin);
  } else {
    showLogin();
  }

  // ── TABS ──
  document.querySelectorAll('.admin-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.admin-tab').forEach(function (t) { t.classList.remove('is-active'); });
      document.querySelectorAll('.admin-panel').forEach(function (p) { p.classList.remove('is-active'); });
      tab.classList.add('is-active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('is-active');
    });
  });

  window.closeModal = function (id) { document.getElementById(id).classList.remove('is-active'); };

  // ── IMAGE HELPER: fayl -> resize -> base64 ──
  function fileToResizedBase64(file, maxDim) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ══════════════════════════════════════════════════════════
  // DASHBOARD
  // ══════════════════════════════════════════════════════════
  async function loadDashboard() {
    try {
      const data = await apiFetch('/api/admin/stats');
      const seg = data.bySegment || {};
      document.getElementById('statGrid').innerHTML =
        '<div class="stat-card"><div class="stat-card__value">' + data.total + '</div><div class="stat-card__label">Jami lidlar</div></div>' +
        '<div class="stat-card"><div class="stat-card__value">' + data.averageScore + '</div><div class="stat-card__label">O\'rtacha ball</div></div>' +
        '<div class="stat-card"><div class="stat-card__value">' + (seg.A || 0) + '</div><div class="stat-card__label">Segment A</div></div>' +
        '<div class="stat-card"><div class="stat-card__value">' + (seg.B || 0) + '</div><div class="stat-card__label">Segment B</div></div>' +
        '<div class="stat-card"><div class="stat-card__value">' + (seg.C || 0) + '</div><div class="stat-card__label">Segment C</div></div>';
      document.getElementById('leadsBody').innerHTML = (data.recent || []).map(function (l) {
        return '<tr><td>' + esc(l.email) + '</td><td>' + l.score + '</td>' +
          '<td><span class="seg-pill seg-' + l.segment + '">' + l.segment + '</span></td>' +
          '<td>' + new Date(l.created_at).toLocaleString('uz-UZ') + '</td></tr>';
      }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--gray-dim)">Hali lidlar yo\'q</td></tr>';
    } catch (err) { console.error(err); }
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ══════════════════════════════════════════════════════════
  // KEYSLAR
  // ══════════════════════════════════════════════════════════
  let casesCache = [];
  async function loadCases() {
    try {
      const data = await apiFetch('/api/cases');
      casesCache = data.cases;
      const list = document.getElementById('casesList');
      list.innerHTML = casesCache.length ? casesCache.map(function (c) {
        return '<div class="item-row">' +
          (c.image ? '<img class="item-row__thumb" src="' + c.image + '" />' : '<div class="item-row__thumb">' + (c.tag || '').split(' ')[0] + '</div>') +
          '<div class="item-row__body"><div class="item-row__title">' + esc(c.title) + '</div>' +
          '<div class="item-row__meta">' + esc(c.tag) + ' · ' + esc(c.metric1.value || '') + ' ' + esc(c.metric1.label || '') + '</div></div>' +
          '<div class="item-row__actions">' +
          '<button class="icon-btn" onclick="openCaseForm(' + c.id + ')" title="Tahrirlash">✎</button>' +
          '<button class="icon-btn danger" onclick="deleteCase(' + c.id + ')" title="O\'chirish">✕</button>' +
          '</div></div>';
      }).join('') : '<div class="empty-state">Hali keyslar yo\'q</div>';
    } catch (err) { console.error(err); }
  }

  window.openCaseForm = function (id) {
    const existing = id ? casesCache.find(function (c) { return c.id === id; }) : null;
    document.getElementById('caseModalTitle').textContent = existing ? 'Keysni tahrirlash' : 'Yangi keys';
    document.getElementById('caseId').value = existing ? existing.id : '';
    document.getElementById('caseTag').value = existing ? existing.tag : '';
    document.getElementById('caseTitle').value = existing ? existing.title : '';
    document.getElementById('caseDesc').value = existing ? existing.desc : '';
    document.getElementById('caseM1v').value = existing ? existing.metric1.value : '';
    document.getElementById('caseM1l').value = existing ? existing.metric1.label : '';
    document.getElementById('caseM2v').value = existing ? existing.metric2.value : '';
    document.getElementById('caseM2l').value = existing ? existing.metric2.label : '';
    document.querySelectorAll('.caseMarket').forEach(function (cb) {
      cb.checked = existing ? existing.markets.indexOf(cb.value) !== -1 : false;
    });
    const preview = document.getElementById('caseImgPreview');
    preview.innerHTML = existing && existing.image ? '<img src="' + existing.image + '" />' : 'Rasm tanlanmagan';
    preview.dataset.value = existing && existing.image ? existing.image : '';
    document.getElementById('caseImgFile').value = '';
    document.getElementById('caseFormMsg').textContent = '';
    document.getElementById('caseModal').classList.add('is-active');
  };

  document.getElementById('caseImgFile').addEventListener('change', async function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const base64 = await fileToResizedBase64(file, 640);
    const preview = document.getElementById('caseImgPreview');
    preview.innerHTML = '<img src="' + base64 + '" />';
    preview.dataset.value = base64;
  });

  document.getElementById('caseForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const msg = document.getElementById('caseFormMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const id = document.getElementById('caseId').value;
    const markets = Array.from(document.querySelectorAll('.caseMarket')).filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; });
    const body = {
      tag: document.getElementById('caseTag').value,
      title: document.getElementById('caseTitle').value,
      desc: document.getElementById('caseDesc').value,
      metric1: { value: document.getElementById('caseM1v').value, label: document.getElementById('caseM1l').value },
      metric2: { value: document.getElementById('caseM2v').value, label: document.getElementById('caseM2l').value },
      markets: markets,
      image: document.getElementById('caseImgPreview').dataset.value || null
    };
    try {
      await apiFetch(id ? '/api/cases/' + id : '/api/cases', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      closeModal('caseModal'); loadCases();
    } catch (err) { msg.textContent = err.message; msg.className = 'form-msg error'; }
  });

  window.deleteCase = async function (id) {
    if (!confirm("Bu keysni o'chirishni tasdiqlaysizmi?")) return;
    try { await apiFetch('/api/cases/' + id, { method: 'DELETE' }); loadCases(); }
    catch (err) { alert(err.message); }
  };

  // ══════════════════════════════════════════════════════════
  // BLOG
  // ══════════════════════════════════════════════════════════
  let postsCache = [];
  async function loadPosts() {
    try {
      const data = await apiFetch('/api/posts');
      postsCache = data.posts;
      const list = document.getElementById('postsList');
      list.innerHTML = postsCache.length ? postsCache.map(function (p) {
        return '<div class="item-row">' +
          (p.image ? '<img class="item-row__thumb" src="' + p.image + '" />' : '<div class="item-row__thumb">📄</div>') +
          '<div class="item-row__body"><div class="item-row__title">' + esc(p.title) + '</div>' +
          '<div class="item-row__meta">' + esc(p.tag) + ' · ' + esc(p.date || '') + ' · ' + esc(p.readTime || '') + '</div></div>' +
          '<div class="item-row__actions">' +
          '<button class="icon-btn" onclick="openPostForm(' + p.id + ')" title="Tahrirlash">✎</button>' +
          '<button class="icon-btn danger" onclick="deletePost(' + p.id + ')" title="O\'chirish">✕</button>' +
          '</div></div>';
      }).join('') : '<div class="empty-state">Hali maqolalar yo\'q</div>';
    } catch (err) { console.error(err); }
  }

  window.openPostForm = function (id) {
    const existing = id ? postsCache.find(function (p) { return p.id === id; }) : null;
    document.getElementById('postModalTitle').textContent = existing ? 'Maqolani tahrirlash' : 'Yangi maqola';
    document.getElementById('postId').value = existing ? existing.id : '';
    document.getElementById('postTag').value = existing ? existing.tag : '';
    document.getElementById('postTitle').value = existing ? existing.title : '';
    document.getElementById('postDesc').value = existing ? existing.desc : '';
    document.getElementById('postDate').value = existing ? existing.date : '';
    document.getElementById('postRead').value = existing ? existing.readTime : '';
    const preview = document.getElementById('postImgPreview');
    preview.innerHTML = existing && existing.image ? '<img src="' + existing.image + '" />' : 'Rasm tanlanmagan';
    preview.dataset.value = existing && existing.image ? existing.image : '';
    document.getElementById('postImgFile').value = '';
    document.getElementById('postFormMsg').textContent = '';
    document.getElementById('postModal').classList.add('is-active');
  };

  document.getElementById('postImgFile').addEventListener('change', async function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const base64 = await fileToResizedBase64(file, 640);
    const preview = document.getElementById('postImgPreview');
    preview.innerHTML = '<img src="' + base64 + '" />';
    preview.dataset.value = base64;
  });

  document.getElementById('postForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const msg = document.getElementById('postFormMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const id = document.getElementById('postId').value;
    const body = {
      tag: document.getElementById('postTag').value,
      title: document.getElementById('postTitle').value,
      desc: document.getElementById('postDesc').value,
      date: document.getElementById('postDate').value,
      readTime: document.getElementById('postRead').value,
      image: document.getElementById('postImgPreview').dataset.value || null
    };
    try {
      await apiFetch(id ? '/api/posts/' + id : '/api/posts', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      closeModal('postModal'); loadPosts();
    } catch (err) { msg.textContent = err.message; msg.className = 'form-msg error'; }
  });

  window.deletePost = async function (id) {
    if (!confirm("Bu maqolani o'chirishni tasdiqlaysizmi?")) return;
    try { await apiFetch('/api/posts/' + id, { method: 'DELETE' }); loadPosts(); }
    catch (err) { alert(err.message); }
  };

  // ══════════════════════════════════════════════════════════
  // NARXLAR
  // ══════════════════════════════════════════════════════════
  let pricingCache = [];
  async function loadPricing() {
    try {
      const data = await apiFetch('/api/pricing');
      pricingCache = data.pricing;
      const list = document.getElementById('pricingList');
      list.innerHTML = pricingCache.length ? pricingCache.map(function (p) {
        return '<div class="item-row">' +
          '<div class="item-row__thumb">💳</div>' +
          '<div class="item-row__body"><div class="item-row__title">' + esc(p.name) + (p.featured ? ' ⭐' : '') + '</div>' +
          '<div class="item-row__meta">' + esc(p.amount) + ' ' + esc(p.currency || '') + ' · ' + esc(p.period || '') + '</div></div>' +
          '<div class="item-row__actions">' +
          '<button class="icon-btn" onclick="openPricingForm(' + p.id + ')" title="Tahrirlash">✎</button>' +
          '<button class="icon-btn danger" onclick="deletePricing(' + p.id + ')" title="O\'chirish">✕</button>' +
          '</div></div>';
      }).join('') : '<div class="empty-state">Hali paketlar yo\'q</div>';
    } catch (err) { console.error(err); }
  }

  window.addFeatureRow = function (value) {
    const wrap = document.getElementById('featuresList');
    const row = document.createElement('div');
    row.className = 'feature-row';
    row.innerHTML = '<input type="text" value="' + (value ? esc(value) : '') + '" placeholder="Xususiyat" />' +
      '<button type="button" onclick="this.parentElement.remove()">✕</button>';
    wrap.appendChild(row);
  };

  window.openPricingForm = function (id) {
    const existing = id ? pricingCache.find(function (p) { return p.id === id; }) : null;
    document.getElementById('pricingModalTitle').textContent = existing ? 'Paketni tahrirlash' : 'Yangi paket';
    document.getElementById('priceId').value = existing ? existing.id : '';
    document.getElementById('priceBadge').value = existing ? existing.badge : '';
    document.getElementById('priceName').value = existing ? existing.name : '';
    document.getElementById('priceDesc').value = existing ? existing.desc : '';
    document.getElementById('priceAmount').value = existing ? existing.amount : '';
    document.getElementById('priceCurrency').value = existing ? existing.currency : '';
    document.getElementById('pricePeriod').value = existing ? existing.period : '';
    document.getElementById('priceCtaLabel').value = existing ? existing.ctaLabel : 'Batafsil';
    document.getElementById('priceCtaType').value = existing ? existing.ctaType : 'secondary';
    document.getElementById('priceFeatured').checked = existing ? existing.featured : false;
    document.getElementById('featuresList').innerHTML = '';
    (existing ? existing.features : ['']).forEach(function (f) { addFeatureRow(f); });
    document.getElementById('pricingFormMsg').textContent = '';
    document.getElementById('pricingModal').classList.add('is-active');
  };

  document.getElementById('pricingForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const msg = document.getElementById('pricingFormMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const id = document.getElementById('priceId').value;
    const features = Array.from(document.querySelectorAll('#featuresList input')).map(function (i) { return i.value.trim(); }).filter(Boolean);
    const body = {
      badge: document.getElementById('priceBadge').value,
      name: document.getElementById('priceName').value,
      desc: document.getElementById('priceDesc').value,
      amount: document.getElementById('priceAmount').value,
      currency: document.getElementById('priceCurrency').value,
      period: document.getElementById('pricePeriod').value,
      ctaLabel: document.getElementById('priceCtaLabel').value,
      ctaType: document.getElementById('priceCtaType').value,
      featured: document.getElementById('priceFeatured').checked,
      features: features
    };
    try {
      await apiFetch(id ? '/api/pricing/' + id : '/api/pricing', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      closeModal('pricingModal'); loadPricing();
    } catch (err) { msg.textContent = err.message; msg.className = 'form-msg error'; }
  });

  window.deletePricing = async function (id) {
    if (!confirm("Bu paketni o'chirishni tasdiqlaysizmi?")) return;
    try { await apiFetch('/api/pricing/' + id, { method: 'DELETE' }); loadPricing(); }
    catch (err) { alert(err.message); }
  };
})();
</script>
