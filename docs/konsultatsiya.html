<main class="consultation-page">
  <section class="lead-form-wrap reveal" aria-labelledby="consultation-title">
    <div class="lead-form-head">
      <span class="tsec__kicker">Bepul konsultatsiya</span>
      <h1 class="tsec__title" id="consultation-title">Biz bilan bog'laning</h1>
      <p class="tsec__desc">Ismingiz, biznes turingiz va telefon raqamingizni qoldiring — mutaxassislarimiz siz bilan tez orada bog'lanadi.</p>
    </div>
    <form id="leadForm" class="lead-form" novalidate>
      <div class="lead-form__field">
        <label for="leadName">Ismingiz</label>
        <input type="text" id="leadName" name="name" required placeholder="Ismingiz" autocomplete="name" />
      </div>
      <div class="lead-form__field">
        <label for="leadBusiness">Biznes turi</label>
        <select id="leadBusiness" name="businessType" required>
          <option value="" disabled selected>Tanlang</option>
          <option value="Biznes egasi">Biznes egasi</option>
          <option value="Brend egasi">Brend egasi</option>
          <option value="Ishlab chiqaruvchi">Ishlab chiqaruvchi</option>
          <option value="Importyor">Importyor</option>
          <option value="Olib sotar">Olib sotar</option>
          <option value="Distribyutor">Distribyutor</option>
        </select>
      </div>
      <div class="lead-form__field">
        <label for="leadPhone">Telefon raqam</label>
        <input type="tel" id="leadPhone" name="phone" required placeholder="+998 90 123 45 67" autocomplete="tel" />
      </div>
      <div class="form-msg" id="leadFormMsg" role="status" aria-live="polite"></div>
      <button type="submit" class="lead-form__submit" id="leadFormSubmit">Ariza yuborish</button>
    </form>
  </section>
</main>
