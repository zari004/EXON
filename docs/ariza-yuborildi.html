.confirm {
  min-height: 100svh;
  padding: calc(var(--nav-h) + clamp(26px,4.6vh,62px)) 0 clamp(40px,8vh,80px);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.confirm::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background: radial-gradient(ellipse 60% 55% at 50% 32%, rgba(11,209,108,.1), transparent 68%);
  filter: blur(20px);
}
.confirm__inner {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 0 clamp(18px,3.4vw,40px);
  text-align: center;
}
.confirm__icon {
  width: 76px;
  height: 76px;
  margin: 0 auto 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, rgba(11,209,108,.2), rgba(53,193,133,.1));
  border: 2px solid rgba(11,209,108,.35);
}
.confirm__title {
  font-size: clamp(1.5rem,3.6vw,2.1rem);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 14px;
}
.confirm__desc {
  font-size: 16px;
  color: var(--gray);
  line-height: 1.55;
  margin-bottom: 36px;
}
.confirm__back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 52px;
  padding: 0 30px;
  border-radius: 999px;
  font-size: 15.5px;
  font-weight: 600;
  background: linear-gradient(140deg, var(--green-hi) 0%, var(--green) 52%, #1FA36C 100%);
  color: var(--green-ink);
  box-shadow: 0 6px 26px -8px rgba(53,193,133,.65);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.confirm__back:hover { transform: translateY(-1px); box-shadow: 0 10px 32px -8px rgba(53,193,133,.8); }
.confirm__back:active { transform: translateY(0); }
.confirm__back svg { width: 18px; height: 18px; }

<script>
// "Lead" hodisasi shu sahifaga yetib kelgan foydalanuvchi uchun hisoblanadi
// (bosh sahifadagi forma shu event ID'ni sessionStorage'ga qo'yib, shu yerga
// yo'naltiradi — brauzer Pixel'i va server Conversions API bir xil hodisani
// ikki marta sanamasligi uchun ikkalasi ham aynan shu ID'dan foydalanadi)
(function () {
  try {
    var eventId = sessionStorage.getItem('exon_lead_event_id');
    if (eventId && typeof fbq === 'function') {
      fbq('track', 'Lead', {}, { eventID: eventId });
    }
    sessionStorage.removeItem('exon_lead_event_id');
  } catch (e) {}
})();

// Nav scroll blur
(function() {
  const nav = document.getElementById('nav');
  function onScroll() {
    nav.classList.toggle('is-scrolled', window.scrollY > 12);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Burger menu
  const burger = document.getElementById('burger');
  const menu = document.getElementById('navMenu');

  function setMenu(open) {
    menu.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
  }

  burger.addEventListener('click', () => {
    setMenu(burger.getAttribute('aria-expanded') !== 'true');
  });

  menu.addEventListener('click', (e) => {
    if (e.target.tagName === 'A') setMenu(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') {
      setMenu(false);
    }
  });
})();
</script>
